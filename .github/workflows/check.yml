name: R-CMD-check

on:
  push:
    branches: [main, redivis]
  pull_request:
  schedule:
    # nightly canary WITH network: catches Redivis/data breakage before
    # users (and long before a CRAN check would)
    - cron: "17 9 * * *"

jobs:
  cran-simulation:
    # no token: every network test skips, exactly as on CRAN
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          error-on: '"warning"'

  network-tests:
    # full characterization suite against Redivis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::pkgload
      - name: Run characterization tests
        env:
          REDIVIS_API_TOKEN: ${{ secrets.REDIVIS_API_TOKEN }}
        run: |
          Rscript -e 'pkgload::load_all("."); testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'
